<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" role="img" aria-labelledby="t">
  <title id="t">Goldie, the Golden Pro Camp mascot</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBE7A1"/>
      <stop offset=".45" stop-color="#E2B04A"/>
      <stop offset="1" stop-color="#9C6A1E"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9A441"/>
      <stop offset="1" stop-color="#7E5114"/>
    </linearGradient>
    <linearGradient id="gi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#E9DCCB"/>
    </linearGradient>
    <linearGradient id="crest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8343F"/>
      <stop offset="1" stop-color="#8E1A26"/>
    </linearGradient>
  </defs>

  <!-- back hair -->
  <g fill="#6B3F1D">
    <circle cx="104" cy="168" r="22"/><circle cx="98" cy="196" r="20"/><circle cx="108" cy="222" r="17"/>
    <circle cx="214" cy="168" r="22"/><circle cx="222" cy="196" r="20"/><circle cx="212" cy="222" r="17"/>
  </g>

  <!-- legs (gi pants) -->
  <g class="legs">
    <path d="M128 318h28l-2 52h-26z" fill="url(#gi)" stroke="#CDBBA5" stroke-width="2"/>
    <path d="M164 318h28l2 52h-26z" fill="url(#gi)" stroke="#CDBBA5" stroke-width="2"/>
    <ellipse cx="140" cy="374" rx="17" ry="8" fill="#E8B996"/>
    <ellipse cx="180" cy="374" rx="17" ry="8" fill="#E8B996"/>
  </g>

  <!-- left arm on hip -->
  <path d="M112 252c-22 10-30 34-16 50 6 6 16 4 20-2" fill="none" stroke="url(#gi)" stroke-width="22" stroke-linecap="round"/>
  <circle cx="114" cy="300" r="11" fill="#F0C6A2"/>

  <!-- right arm waving -->
  <g class="wave">
    <path d="M206 254c18-12 30-34 32-62" fill="none" stroke="url(#gi)" stroke-width="22" stroke-linecap="round"/>
    <circle cx="239" cy="184" r="13" fill="#F0C6A2"/>
    <path d="M231 176v-12M238 173v-14M245 174v-12" stroke="#F0C6A2" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- body: gi top -->
  <path d="M112 244c10-14 30-20 48-20s38 6 48 20l6 80h-108z" fill="url(#gi)" stroke="#CDBBA5" stroke-width="2"/>
  <!-- gi lapels -->
  <path d="M138 232l22 46 22-46" fill="none" stroke="#CDBBA5" stroke-width="10" stroke-linejoin="round"/>
  <path d="M146 234l14 30 14-30z" fill="#2A1E19"/>
  <!-- gold pauldrons -->
  <path d="M104 252c2-16 14-26 30-26l-4 26c-8 2-16 4-26 0z" fill="url(#gold)" stroke="#8A5A17" stroke-width="2"/>
  <path d="M216 252c-2-16-14-26-30-26l4 26c8 2 16 4 26 0z" fill="url(#gold)" stroke="#8A5A17" stroke-width="2"/>

  <!-- golden belt with knot -->
  <rect x="110" y="292" width="100" height="16" rx="4" fill="url(#gold)" stroke="#8A5A17" stroke-width="2"/>
  <path d="M152 306l-14 30 12 2 12-26z" fill="url(#goldDark)"/>
  <path d="M168 306l16 28-12 4-12-24z" fill="url(#goldDark)"/>
  <rect x="148" y="288" width="24" height="24" rx="6" fill="url(#gold)" stroke="#8A5A17" stroke-width="2"/>

  <!-- neck + head -->
  <rect x="150" y="214" width="20" height="18" fill="#E8B996"/>
  <circle cx="160" cy="172" r="56" fill="#F3CDAA"/>

  <!-- front curls -->
  <g fill="#7A4A22">
    <circle cx="112" cy="186" r="13"/><circle cx="208" cy="186" r="13"/>
    <circle cx="110" cy="164" r="12"/><circle cx="210" cy="164" r="12"/>
  </g>

  <!-- face -->
  <ellipse cx="140" cy="182" rx="7" ry="9" fill="#2B1B14"/>
  <ellipse cx="180" cy="182" rx="7" ry="9" fill="#2B1B14"/>
  <circle cx="142.5" cy="178.5" r="2.6" fill="#fff"/>
  <circle cx="182.5" cy="178.5" r="2.6" fill="#fff"/>
  <path d="M131 166q9-6 17 0M172 166q9-6 17 0" fill="none" stroke="#5A3418" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="128" cy="200" rx="9" ry="5" fill="#E79A8C" opacity=".6"/>
  <ellipse cx="192" cy="200" rx="9" ry="5" fill="#E79A8C" opacity=".6"/>
  <path d="M148 204q12 12 24 0" fill="#8E2A33" stroke="#6E1C25" stroke-width="2" stroke-linecap="round"/>

  <!-- crest: upright Greek plume running front to back over the helmet -->
  <path d="M134 108c-6-30-4-58 6-74 6-10 13-14 20-14s14 4 20 14c10 16 12 44 6 74z" fill="url(#crest)" stroke="#5E1421" stroke-width="3" stroke-linejoin="round"/>
  <g fill="none" stroke="#F49A97" stroke-width="2.2" stroke-linecap="round" opacity=".7">
    <path d="M160 100V26M150 100c-4-24-2-50 4-66M170 100c4-24 2-50-4-66M141 100c-3-20-2-40 3-54M179 100c3-20 2-40-3-54"/>
  </g>

  <!-- helmet -->
  <path d="M100 160c0-44 26-70 60-70s60 26 60 70c-8-6-20-10-30-10h-60c-10 0-22 4-30 10z" fill="url(#gold)" stroke="#8A5A17" stroke-width="3"/>
  <path d="M104 154c16-8 34-10 56-10s40 2 56 10" fill="none" stroke="#8A5A17" stroke-width="3"/>
  <path d="M118 120c10-14 26-22 42-22" fill="none" stroke="#FFF6D6" stroke-width="5" stroke-linecap="round" opacity=".7"/>
  <!-- small star on helmet -->
  <path d="M160 112l3 7 7 .5-5.5 4.5 2 7-6.5-4-6.5 4 2-7-5.5-4.5 7-.5z" fill="#FFF3C4"/>
</svg>
