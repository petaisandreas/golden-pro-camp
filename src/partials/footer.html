<footer class="footer">
  <div class="wave wave--sweep"><!-- include: sweep --></div>
  <div class="footer__grid">
    <div class="footer__brand">
      <img src="assets/img/logo-light.png" alt="Golden Pro" width="689" height="871" loading="lazy">
      <p>Female Training Camp &middot; Cyprus</p>
    </div>
    <div class="camps">
      <h3>{{ campsHeading }}</h3>
      <!-- camps -->
    </div>
    <div>
      <h3>Contact</h3>
      <ul class="footer__contact">
        <li><svg><use href="#i-instagram"/></svg><a href="{{ contact.instagram }}" target="_blank" rel="noopener">{{ contact.instagramHandle }}</a></li>
        <li><svg><use href="#i-mail"/></svg><a href="mailto:{{ contact.email }}">{{ contact.email }}</a></li>
        <li><svg><use href="#i-whatsapp"/></svg><a href="{{ contact.whatsappLink }}" target="_blank" rel="noopener">{{ contact.whatsapp }}</a></li>
        <li><svg><use href="#i-pin"/></svg><span>{{ contact.location }}</span></li>
      </ul>
    </div>
  </div>
  <div class="footer__bottom">
    <span>&copy; <span data-year></span> Golden Pro</span>
  </div>
  <!-- credit -->
</footer>
